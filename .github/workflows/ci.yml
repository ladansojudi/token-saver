name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate SKILL.md frontmatter
        run: python tests/validate_skill.py
      - name: Validate JSON manifests
        run: |
          python -m json.tool .claude-plugin/plugin.json > /dev/null
          python -m json.tool .claude-plugin/marketplace.json > /dev/null
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example audit runs
        run: python skills/token-saver/scripts/audit_setup.py --home examples/heavy-setup/home --project examples/heavy-setup/project
